# Netlify configuration for the static Pink Party Girls site.
# No build step — the repo root is published as-is.

[build]
  publish = "."
  command = ""

# Pretty URL for the CMS.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Always serve fresh content JSON so edits show up immediately.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
