# Netlify configuration for the static Pink Party Girls site.
# No build step — the repo root is published as-is.
# Content is edited via Pages CMS (https://app.pagescms.org), which commits
# straight to this repo; Netlify then redeploys.

[build]
  publish = "."
  command = ""

# Always serve fresh content JSON so CMS edits show up immediately.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
